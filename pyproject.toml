[project]
name = "seqneut-pipeline"
version = "9.2.0"
description = "Modular analysis pipeline for high-throughput sequencing-based neutralization assays"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Bloom Lab", email = "jbloom@fredhutch.org"}
]
requires-python = ">=3.13"

[tool.black]
target-version = ["py313", "py314"]

[project.urls]
Homepage = "https://github.com/jbloomlab/seqneut-pipeline"
Repository = "https://github.com/jbloomlab/seqneut-pipeline"
Issues = "https://github.com/jbloomlab/seqneut-pipeline/issues"

[tool.ruff]
builtins = [
    "snakemake",  # may appear undefined as passed to scripts via `Snakefile`
]

# `./tests` holds the tests of the code this pipeline shares with the projects that
# include it. `test_example/test_titers_as_expected.py` is not among them: it is a script
# run from within `test_example` after the pipeline has been run there.
[tool.pytest.ini_options]
testpaths = ["tests"]
