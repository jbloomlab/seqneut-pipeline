# `conda` environment for the `validate_viral_library` rule of `seqneut-pipeline.smk`.
# A package pinned here must be pinned identically in ../environment.yml and every other
# file in this directory, which tests/test_envs.py checks.
name: seqneut-pipeline-validate_viral_library

channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  - biopython=1.88
  - pandas=2.3
  - python=3.14
