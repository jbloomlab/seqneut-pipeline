# `conda` environment for the `build_docs` rule of `seqneut-pipeline.smk`.
# A package pinned here must be pinned identically in ../environment.yml and every other
# file in this directory, which tests/test_envs.py checks.
name: seqneut-pipeline-build_docs

channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  - markdown=3.10
  - python=3.14
