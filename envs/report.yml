# `conda` environment for the `groups_sera_by_plate`, `plate_to_plate_corr`, and
# `aggregate_qc_drops` rules of `seqneut-pipeline.smk`.
# A package pinned here must be pinned identically in ../environment.yml and every other
# file in this directory, which tests/test_envs.py checks.
name: seqneut-pipeline-report

channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  - altair=6.2
  - markdown=3.10
  - pandas=2.3
  - pyarrow
  - python=3.14
  - ruamel.yaml=0.19
