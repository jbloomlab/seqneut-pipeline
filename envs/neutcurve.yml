# `conda` environment for the `process_plate`, `group_serum_titers`, and `aggregate_titers`
# rules of `seqneut-pipeline.smk`.
# A package pinned here must be pinned identically in ../environment.yml and every other
# file in this directory, which tests/test_envs.py checks.
name: seqneut-pipeline-neutcurve

channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  - altair=6.2
  - markdown=3.10
  - pandas=2.3
  - pillow=12.3
  - pip
  - pyarrow
  - python=3.14
  - ruamel.yaml=0.19
  - pip:
    - neutcurve==2.5.0
