# === Analysis configuration file ======================================================


# --- Configuration for `seqneut-pipeline` ---------------------------------------------

# for this test example the location is "../" but for real analyses it should almost
# certainly be "seqneut-pipeline'
seqneut-pipeline: ../

# change this to a good description of your project
description: |
  # Test example for [seqneut-pipeline](https://github.com/jbloomlab/seqneut-pipeline)
  This is a small toy-example created by subsetting a real experiment dataset.

  See [https://github.com/jbloomlab/seqneut-pipeline](https://github.com/jbloomlab/seqneut-pipeline)
  for the computer code and underlying numerical data.

  See [here](https://github.com/jbloomlab/seqneut-pipeline/graphs/contributors) for a
  list of all contributors to the pipeline.

viral_libraries:
  pdmH1N1_lib2023_loes: data/viral_libraries/pdmH1N1_lib2023_loes.csv
  H3N2_lib2023_Kikawa: data/viral_libraries/2023_H3N2_Kikawa.csv
  pdmH1N1_lib2023_loes_final: data/viral_libraries/pdmH1N1_lib2023_loes_final.csv

# Optional checks on each library in `viral_libraries`, one entry per library. These
# describe only the `barcode` and `strain` the checks apply to; `stock_id` is left out, as
# it describes the tube rather than the strain or the barcode and so fits neither the
# per-strain nor the per-barcode checks. A real project may describe other columns as well.
viral_library_validations:
  pdmH1N1_lib2023_loes: &library_validations
    columns:
      # uppercase is required, not merely conventional: the uniqueness check compares
      # exact strings, so a lowercase barcode would not collide with its uppercase twin
      barcode: {nulls: false, unique: barcode, matches: ['^[ACGT]{16}$']}
      strain: {nulls: false, matches: ['^\S+$']}
  H3N2_lib2023_Kikawa: *library_validations
  pdmH1N1_lib2023_loes_final: *library_validations

viral_strain_plot_order: data/viral_strain_plot_order.csv

curve_display_method: svg  # {svg, pdf, png8}; svg best resolution, png8 smallest

neut_standard_sets:
  loes2023: data/neut_standard_sets/loes2023_neut_standards.csv

illumina_barcode_parser_params:
  upstream: CTCCCTACAATGTCGGATTTGTATTTAATAG
  downstream: ''
  minq: 20
  upstream_mismatch: 4
  bc_orientation: R2

# `plates` and `miscellaneous_plates` are long, so they are in their own files
addtl_config_files:
  - data/config/plates.yml
  - data/config/miscellaneous_plates.yml

default_serum_titer_as: midpoint  # can be "midpoint" or "nt50"

default_serum_qc_thresholds: &default_serum_qc_thresholds
  min_replicates: 2
  max_fold_change_from_median: 3
  viruses_ignore_qc: []

sera_override_defaults:
  serum:
    M099d30:
      qc_thresholds:
        <<: *default_serum_qc_thresholds
        viruses_ignore_qc:
          - A/Belgium/H0017/2022
    Y044d30:
      qc_thresholds:
        <<: *default_serum_qc_thresholds
        max_fold_change_from_median: 4
      titer_as: nt50

# Barcodes in every well that no analysis of the miscellaneous plates counts.
discarded_barcodes:
  GGCAGATTTTCATATT: made up for this example

# Analyses of the miscellaneous plates below, each reported on one page of the docs.
analyze_single_well_infections:
  single_well_strains:
    analyze_by: strain  # the samples CSVs name a strain per well in a `strain` column
    miscellaneous_plates: [single_well_plate_1, single_well_plate_2]
    description: |
      Synthetic plates of one strain per well, built so that each well holds one thing
      the analysis has to get right.
    final_viral_library: pdmH1N1_lib2023_loes_final
    # the thresholds wells are flagged by, here at their defaults
    <<: &single_well_flag_thresholds
      max_other_library_frac: 0.005
      max_unmatched_frac: 0.02
      min_parsed_reads_per_well: 1000
      min_neut_standard_reads_for_titer: 100
  single_well_barcodes:
    analyze_by: barcode
    miscellaneous_plates: [single_well_plate_3]
    description: |
      A synthetic plate of one barcode per well, two wells of which hold barcodes that
      share a tube, the second holding some of the first's. Analyzing by barcode ignores
      the tube, so that sibling is unexpected material here.
    # charted with the wells along `x`, so that both orientations are exercised
    strain_axis: x
    <<: *single_well_flag_thresholds
  single_well_stocks:
    analyze_by: stock
    miscellaneous_plates: [single_well_plate_4]
    description: |
      A synthetic plate of one tube per well: two wells are infected from a tube holding
      two barcodes, and another from a second tube of the same strain.
    <<: *single_well_flag_thresholds
