name: Run tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: build conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: seqneut-pipeline
          environment-file: environment.yml
          auto-activate: false
          auto-update-conda: true
          channel-priority: strict

      - name: lint with ruff
        # NOTE: must specify the shell so that conda init updates bashrc see:
        #      https://github.com/conda-incubator/setup-miniconda#IMPORTANT
        shell: bash -el {0}
        run: ruff check .

      - name: check code format with black
        shell: bash -el {0}
        run: black --check .

      - name: check snakemake files format with snakefmt
        shell: bash -el {0}
        run: snakefmt --check .

      - name: test code with pytest
        shell: bash -el {0}
        run: pytest

      - name: lint snakemake files with snakemake --lint
        shell: bash -el {0}
        run: cd test_example && snakemake --lint && cd ..

      - name: run pipeline on test example
        shell: bash -el {0}
        run: >
          cd test_example
          && rm -rf results
          && snakemake --software-deployment-method conda -j 2
          && cd ..

      - name: test titers as expected
        shell: bash -el {0}
        run: cd test_example && python test_titers_as_expected.py && cd ..

      - name: test the viral libraries were validated
        shell: bash -el {0}
        run: >
          cd test_example
          && test -f results/validate_viral_library/H3N2_lib2023_Kikawa_validation.txt
          && grep -q "110 barcodes for 36 strains"
          results/validate_viral_library/pdmH1N1_lib2023_loes_validation.txt
          && cd ..

      - name: run pipeline on test example collapsing strain barcodes
        # in a copy of the test example so the results of the run above are kept
        shell: bash -el {0}
        run: >
          cp -a test_example _test_example_collapsed
          && cd _test_example_collapsed
          && rm -rf results
          && snakemake --software-deployment-method conda -j 2
          --configfile config_collapse_strain_barcodes.yml
          && python test_titers_as_expected.py
          expected_titers_for_test_collapse_strain_barcodes.csv
          && cd ..

      - name: run pipeline on test example with no plates
        # in a copy of the test example so the results of the runs above are kept. A
        # project with no `plates` just counts barcodes for its `miscellaneous_plates`,
        # and its docs then hold only the HTMLs added with `add_htmls_to_docs` and none of
        # the sections that describe plates.
        shell: bash -el {0}
        run: >
          cp -a test_example _test_example_no_plates
          && cd _test_example_no_plates
          && rm -rf results
          && snakemake --software-deployment-method conda -j 2
          --configfile config_no_plates.yml
          && test -f results/docs/example_html.html
          && grep -q "Example HTML file" results/docs/index.html
          && ! grep -q "Titers for all sera" results/docs/index.html
          && ! grep -q "Per-plate counts and curve fits" results/docs/index.html
          && ! grep -q "quality control" results/docs/index.html
          && cd ..

      - name: run pipeline on test example with a viral library that fails validation
        # `viral_library_validations` exists to stop a run on a library that does not meet
        # it, so the failure is tested as well as the success. Just the one validation is
        # requested, with one job, so that which log the run leaves behind does not depend
        # on the order `snakemake` happens to schedule jobs in. The assertion is on the
        # log, as `snakemake` deletes a failed job's output but keeps its log.
        shell: bash -el {0}
        run: >
          cp -a test_example _test_example_bad_viral_library
          && cd _test_example_bad_viral_library
          && rm -rf results
          && ! snakemake --software-deployment-method conda -j 1
          --configfile config_bad_viral_library.yml
          -- results/validate_viral_library/pdmH1N1_lib2023_loes_validation.txt
          && ! test -f results/validate_viral_library/pdmH1N1_lib2023_loes_validation.txt
          && grep -q "FAIL  .barcode. matches"
          results/logs/validate_viral_library_pdmH1N1_lib2023_loes.txt
          && grep -q "OK   .strain. matches"
          results/logs/validate_viral_library_pdmH1N1_lib2023_loes.txt
          && cd ..

      - name: upload results in case of error
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: results
          path: |
            test_example/results
            _test_example_collapsed/results
            _test_example_no_plates/results
            _test_example_bad_viral_library/results
          retention-days: 7
